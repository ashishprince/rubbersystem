name: CI/CD - Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Create network if not exists
            docker network create rubber-net 2>/dev/null || true

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest

            # Stop and remove old web + nginx containers (keep db to preserve data)
            docker stop rubberplantation-web rubberapp-nginx 2>/dev/null || true
            docker rm rubberplantation-web rubberapp-nginx 2>/dev/null || true

            # Start DB if not already running
            docker run -d \
              --name rubber-db \
              --network rubber-net \
              --restart unless-stopped \
              -e POSTGRES_DB=rubber_db \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD='Ashish2005#' \
              -v pgdata:/var/lib/postgresql/data \
              postgis/postgis:15-3.3 2>/dev/null || true

            # Reconnect DB to network in case it was disconnected
            docker network connect rubber-net rubber-db 2>/dev/null || true

            # Wait for DB to be ready
            sleep 15

            # Start the web container
            docker run -d \
              --name rubberplantation-web \
              --network rubber-net \
              --restart unless-stopped \
              -v staticfiles:/app/staticfiles \
              --env DB_HOST=rubber-db \
              ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest

            # Wait for web to start
            sleep 5

            # Get web container IP for Nginx upstream
            WEB_IP=$(docker inspect rubberplantation-web --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')

            # Write nginx config using the container IP (avoids DNS issues)
            mkdir -p /home/ubuntu/rubberapp
            printf "server {\n    listen 80;\n    location /static/ {\n        alias /app/staticfiles/;\n    }\n    location / {\n        proxy_pass http://%s:8000;\n        proxy_set_header Host \$http_host;\n        proxy_set_header X-Real-IP \$remote_addr;\n    }\n}\n" "$WEB_IP" > /home/ubuntu/rubberapp/nginx.conf

            # Start Nginx
            docker run -d \
              --name rubberapp-nginx \
              --network rubber-net \
              --restart unless-stopped \
              -p 80:80 \
              -v /home/ubuntu/rubberapp/nginx.conf:/etc/nginx/conf.d/default.conf \
              -v staticfiles:/app/staticfiles \
              nginx:alpine

            # Run migrations
            sleep 5
            docker exec rubberplantation-web python manage.py migrate || true
