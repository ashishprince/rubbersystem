name: CI/CD - Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Install docker-compose-plugin if not present
            which docker compose || (sudo apt-get update && sudo apt-get install -y docker-compose-plugin)

            # Go to app directory
            mkdir -p /home/ubuntu/rubberapp
            cd /home/ubuntu/rubberapp

            # Copy compose and nginx config from the container
            docker pull ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest

            # Write nginx config
            cat > nginx.conf << 'EOF'
            upstream django {
                server web:8000;
            }

            server {
                listen 80;

                location /static/ {
                    alias /app/staticfiles/;
                }

                location /media/ {
                    alias /app/media/;
                }

                location / {
                    proxy_pass http://django;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            # Write docker-compose.yml
            cat > docker-compose.yml << 'EOF'
            version: '3.8'

            services:
              db:
                image: postgis/postgis:15-3.3
                restart: unless-stopped
                environment:
                  POSTGRES_DB: rubber_db
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: Ashish2005#
                volumes:
                  - pgdata:/var/lib/postgresql/data

              web:
                image: ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest
                restart: unless-stopped
                environment:
                  - DB_HOST=db
                depends_on:
                  - db
                volumes:
                  - staticfiles:/app/staticfiles

              nginx:
                image: nginx:alpine
                restart: unless-stopped
                ports:
                  - "80:80"
                volumes:
                  - ./nginx.conf:/etc/nginx/conf.d/default.conf
                  - staticfiles:/app/staticfiles
                depends_on:
                  - web

            volumes:
              pgdata:
              staticfiles:
            EOF

            # Stop old standalone containers if running
            docker stop rubberplantation-web rubber-db nginx 2>/dev/null || true
            docker rm rubberplantation-web rubber-db nginx 2>/dev/null || true

            # Deploy using docker compose
            docker compose pull
            docker compose up -d

            # Wait for DB then run migrations
            sleep 15
            docker compose exec -T web python manage.py migrate || true
