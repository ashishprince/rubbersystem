name: CI/CD - Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Create a Docker network so the containers can communicate
            docker network create rubber-net || true

            # Pull the latest web image
            docker pull ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest
            
            # Stop and remove the old web container if it exists
            docker stop rubberplantation-web || true
            docker rm rubberplantation-web || true
            
            # Start the PostGIS database container if not already running
            docker run -d \
              --name rubber-db \
              --restart unless-stopped \
              -e POSTGRES_DB=rubber_db \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD='Ashish2005#' \
              -v pgdata:/var/lib/postgresql/data \
              postgis/postgis:15-3.3 || true

            # Connect rubber-db to the network (works whether new or existing)
            docker network connect rubber-net rubber-db || true

            # Wait for database to be ready
            sleep 10

            # Run the new web container
            docker run -d \
              --name rubberplantation-web \
              --network rubber-net \
              -p 80:8000 \
              --restart unless-stopped \
              --env DB_HOST=rubber-db \
              ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest

            # Run database migrations
            docker exec rubberplantation-web python manage.py migrate || true
