name: CI/CD - Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Pull the latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest
            
            # Stop and remove the old container if it exists
            docker stop rubberplantation-web || true
            docker rm rubberplantation-web || true
            
            # Run the new container
            docker run -d \
              --name rubberplantation-web \
              -p 80:8000 \
              --restart unless-stopped \
              --env DB_HOST=host.docker.internal \
              ${{ secrets.DOCKER_USERNAME }}/rubberplantation:latest
